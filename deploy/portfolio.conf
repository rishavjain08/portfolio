# nginx site config for the server that fronts this app.
#
# Not read by anything in this repo and not baked into the image: the container
# carries its own nginx (see the Dockerfile), and this is the *host* nginx that
# proxies to it. It lives here so it arrives on the server with the clone and is
# reviewed alongside the code that depends on it.
#
# Install:
#   sudo cp deploy/portfolio.conf /etc/nginx/conf.d/portfolio.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# On Debian/Ubuntu the convention is sites-available + a symlink instead:
#   sudo cp deploy/portfolio.conf /etc/nginx/sites-available/portfolio
#   sudo ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
#
# Two placeholders to replace before installing, both marked EDIT below:
# the domain, and the certificate paths.

upstream scroll_hero {
    # Where the container is published. Bind it to loopback on the host
    # (docker run -p 127.0.0.1:8080:80) so the container cannot be reached
    # directly from outside, bypassing the TLS and headers below.
    #
    # A literal address rather than a Docker DNS name on purpose: nginx
    # resolves upstream names once at startup, so a recreated container with a
    # new IP would leave it proxying into the void until reloaded.
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;                              # EDIT

    # Must stay reachable over plain HTTP or certbot renewal fails.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;                              # EDIT

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;   # EDIT
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;     # EDIT
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- the app --------------------------------------------------------
    location /portfolio/ {
        # No trailing slash or path on proxy_pass. That is what preserves the
        # prefix: /portfolio/assets/x.js reaches the container as
        # /portfolio/assets/x.js, which is where it lives on disk there.
        # Writing http://scroll_hero/ instead strips /portfolio/, and since the
        # built HTML asks for its bundles by that name, every asset 404s.
        proxy_pass http://scroll_hero;

        proxy_http_version 1.1;
        # Required for the keepalive pool above to do anything.
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Deliberately NOT setting Accept-Encoding to "". It is a common line to
        # carry over from a sub_filter config and it silently disables the
        # container's gzip, which is the difference between 296KB and 1.1MB for
        # the three.js chunk alone.
    }

    # Bare /portfolio, so it reaches the container's own redirect to
    # /portfolio/ rather than falling through to the catch-all below.
    location = /portfolio {
        proxy_pass http://scroll_hero;
        proxy_set_header Host $host;
    }

    # ---- everything else ------------------------------------------------
    # Placeholder. Replace with whatever else this server already serves; if
    # the app is the only thing on this domain, redirect the root to it:
    #
    #   location = / { return 301 /portfolio/; }
    #
    location / {
        return 404;
    }
}
