# Host nginx config, HTTPS. Install this once certbot has issued a certificate.
#
# Not read by anything in this repo and not baked into the image: the container
# carries its own nginx (docker/nginx.conf), and this is the *host* nginx that
# proxies to it. It lives here so it arrives on the server with the clone and is
# reviewed alongside the code that depends on it.
#
# Install (Debian/Ubuntu):
#   sudo cp deploy/portfolio.conf /etc/nginx/sites-available/portfolio
#   sudo ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# BEFORE INSTALLING, check nothing else already serves this domain on 443:
#
#   grep -rn "server_name\|listen 443" /etc/nginx/sites-enabled/ /etc/nginx/conf.d/
#
# Two 443 blocks with the same server_name is not an error, it is a warning, and
# nginx quietly uses the first one it parsed. If a block for this domain already
# exists, move the two location blocks below into it rather than installing this
# file, or the proxy will look correct and never be reached.

upstream scroll_hero {
    # Where the container is published on the host. Keep this on loopback
    # (docker run -p 127.0.0.1:8080:80) so the container cannot be reached
    # directly from the internet, bypassing TLS and the headers below.
    #
    # A literal address rather than a Docker DNS name on purpose: nginx resolves
    # upstream names once at startup, so a recreated container with a new IP
    # would leave it proxying into the void until reloaded.
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name rishavjain.com www.rishavjain.com;

    # Must stay reachable over plain HTTP or certbot renewal fails.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # http2 goes on the listen line, not as a separate `http2 on;` directive.
    # Ubuntu 24.04 ships nginx 1.24, and the standalone directive only exists
    # from 1.25.1 — using it there fails the config test outright.
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name rishavjain.com www.rishavjain.com;

    ssl_certificate     /etc/letsencrypt/live/rishavjain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rishavjain.com/privkey.pem;

    # certbot's managed file already sets protocols, ciphers, session cache and
    # stapling. Setting ssl_protocols or ssl_ciphers again here would override
    # it and quietly undo whatever certbot tunes in a future release.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HSTS is deliberately commented out. It tells browsers to refuse plain HTTP
    # for this domain for a year, and it cannot be taken back by removing the
    # header — clients that saw it keep enforcing it. Enable it once you are
    # confident every subpath of this domain will stay on HTTPS.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # ---- the app --------------------------------------------------------
    location /portfolio/ {
        # No trailing slash or path on proxy_pass. That is what preserves the
        # prefix: /portfolio/assets/x.js reaches the container as
        # /portfolio/assets/x.js, which is where it lives on disk there.
        # Writing http://scroll_hero/ instead strips /portfolio/, and since the
        # built HTML asks for its bundles by that name, every asset 404s.
        proxy_pass http://scroll_hero;

        proxy_http_version 1.1;
        # Required for the keepalive pool above to do anything.
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Deliberately NOT setting Accept-Encoding to "". It is a common line to
        # carry over from a sub_filter config and it silently disables the
        # container's gzip, which is the difference between 296KB and 1.1MB for
        # the three.js chunk alone.
    }

    # Bare /portfolio, so it reaches the container's own redirect to
    # /portfolio/ rather than falling through to the root below.
    location = /portfolio {
        proxy_pass http://scroll_hero;
        proxy_set_header Host $host;
    }

    # The app is the only thing here, so send the root to it. Drop this if the
    # domain serves something else at /.
    location = / {
        return 301 /portfolio/;
    }
}
