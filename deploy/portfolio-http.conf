# Host nginx config, plain HTTP. Start here.
#
# The TLS version is deploy/portfolio.conf, but it will not even pass `nginx -t`
# until certificates exist on disk, and Let's Encrypt cannot issue a certificate
# for a bare IP address. So: bring the site up on port 80 with this file first,
# point a domain at the server, then let certbot rewrite this block in place:
#
#   sudo certbot --nginx -d example.com
#
# certbot adds the listen 443, the certificate paths and the HTTP redirect
# itself, which is why this file is the better starting point than hand-editing
# the TLS one.
#
# Install (Debian/Ubuntu):
#   sudo cp deploy/portfolio-http.conf /etc/nginx/sites-available/portfolio
#   sudo ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
#   sudo rm /etc/nginx/sites-enabled/default      # or it shadows this one
#   sudo nginx -t && sudo systemctl reload nginx
#
# Install (RHEL/Alma/Rocky, official nginx packages):
#   sudo cp deploy/portfolio-http.conf /etc/nginx/conf.d/portfolio.conf
#   sudo nginx -t && sudo systemctl reload nginx

upstream scroll_hero {
    # Where the container is published on the host. Keep this on loopback
    # (docker run -p 127.0.0.1:8080:80) so the container cannot be reached
    # directly from the internet, bypassing this nginx.
    #
    # A literal address rather than a Docker DNS name on purpose: nginx resolves
    # upstream names once at startup, so a recreated container with a new IP
    # would leave it proxying into the void until reloaded.
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # An underscore matches any Host, which is what you want while the site is
    # still reached by IP. Replace with the real domain before running certbot,
    # since certbot matches the block by server_name.
    server_name _;

    location /portfolio/ {
        # No trailing slash or path on proxy_pass. That is what preserves the
        # prefix: /portfolio/assets/x.js reaches the container as
        # /portfolio/assets/x.js, which is where it lives on disk there.
        # Writing http://scroll_hero/ instead strips /portfolio/, and since the
        # built HTML asks for its bundles by that name, every asset 404s.
        proxy_pass http://scroll_hero;

        proxy_http_version 1.1;
        # Required for the keepalive pool above to do anything.
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Deliberately NOT setting Accept-Encoding to "". It is a common line to
        # carry over from a sub_filter config and it silently disables the
        # container's gzip, which is the difference between 296KB and 1.1MB for
        # the three.js chunk alone.
    }

    # Bare /portfolio, so it reaches the container's own redirect to
    # /portfolio/ rather than falling through to the root below.
    location = /portfolio {
        proxy_pass http://scroll_hero;
        proxy_set_header Host $host;
    }

    # The app is the only thing here, so send the root to it. Drop this if the
    # server serves something else at /.
    location = / {
        return 301 /portfolio/;
    }
}
